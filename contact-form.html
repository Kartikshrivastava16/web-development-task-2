<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Form – Task 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7f4 0%, #f0f4ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,128,128,0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
    }

    .card h1 {
      color: #006666;
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    .card p.sub {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #d0e8e8;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #008080;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .row .form-group { flex: 1; }

    .btn {
      width: 100%;
      padding: 12px;
      background: #008080;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #006666; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .success-msg {
      display: none;
      background: #e6f7f7;
      border: 1.5px solid #008080;
      color: #005555;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact Us</h1>
    <p class="sub">Fill in the form below and we'll get back to you shortly.</p>

    <div class="row">
      <div class="form-group">
        <label for="fname">First Name</label>
        <input type="text" id="fname" placeholder="John" />
      </div>
      <div class="form-group">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" placeholder="Doe" />
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="john@example.com" />
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="+91 98765 43210" />
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject">
        <option value="">-- Select a subject --</option>
        <option>General Inquiry</option>
        <option>Support</option>
        <option>Feedback</option>
        <option>Partnership</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Write your message here..."></textarea>
    </div>

    <button class="btn" onclick="handleSubmit()">Send Message</button>
    <div class="success-msg" id="successMsg">✅ Thank you! Your message has been sent.</div>
  </div>

  <script>
    function handleSubmit() {
      const msg = document.getElementById('successMsg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 4000);
    }
  </script>
</body>
</html>
