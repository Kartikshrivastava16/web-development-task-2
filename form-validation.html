<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form Validation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7f4 0%, #f0f4ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,128,128,0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
    }

    h1 { color: #006666; font-size: 1.6rem; margin-bottom: 6px; }
    p.sub { color: #666; font-size: 0.88rem; margin-bottom: 28px; }

    .form-group { margin-bottom: 18px; position: relative; }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      font-size: 0.88rem;
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #d0e8e8;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input:focus, textarea:focus { border-color: #008080; }
    input.error, textarea.error { border-color: #e53935; }
    input.valid, textarea.valid { border-color: #43a047; }

    .err-msg {
      color: #e53935;
      font-size: 0.78rem;
      margin-top: 4px;
      min-height: 16px;
      display: block;
    }

    .strength-bar {
      height: 5px;
      border-radius: 4px;
      margin-top: 6px;
      background: #eee;
      overflow: hidden;
    }

    .strength-bar span {
      display: block;
      height: 100%;
      width: 0;
      transition: width 0.3s, background 0.3s;
    }

    .strength-label { font-size: 0.76rem; color: #888; margin-top: 3px; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .checkbox-row input { width: auto; }
    .checkbox-row label { margin: 0; font-weight: 400; font-size: 0.88rem; }

    .btn {
      width: 100%;
      padding: 12px;
      background: #008080;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #006666; transform: translateY(-1px); }

    .success-banner {
      display: none;
      background: #e6f7f7;
      border: 1.5px solid #008080;
      color: #005555;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Register</h1>
  <p class="sub">All fields are required. Validation runs on submit.</p>

  <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="John Doe"/>
    <span class="err-msg" id="nameErr"></span>
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="text" id="email" placeholder="john@example.com"/>
    <span class="err-msg" id="emailErr"></span>
  </div>

  <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" placeholder="10-digit number"/>
    <span class="err-msg" id="phoneErr"></span>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Min 8 chars" oninput="checkStrength(this.value)"/>
    <div class="strength-bar"><span id="strengthBar"></span></div>
    <div class="strength-label" id="strengthLabel"></div>
    <span class="err-msg" id="passErr"></span>
  </div>

  <div class="form-group">
    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Repeat password"/>
    <span class="err-msg" id="confirmErr"></span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="terms"/>
    <label for="terms">I agree to the Terms &amp; Conditions</label>
  </div>
  <span class="err-msg" id="termsErr" style="margin-top:-14px;margin-bottom:14px;display:block;"></span>

  <button class="btn" onclick="validateForm()">Create Account</button>
  <div class="success-banner" id="successBanner">🎉 Account created successfully!</div>
</div>

<script>
  function setField(id, errId, valid, msg) {
    const el = document.getElementById(id);
    const err = document.getElementById(errId);
    el.className = valid ? 'valid' : 'error';
    err.textContent = valid ? '' : msg;
    return valid;
  }

  function checkStrength(val) {
    const bar = document.getElementById('strengthBar');
    const lbl = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { w: '0%', bg: '#eee', txt: '' },
      { w: '25%', bg: '#e53935', txt: 'Weak' },
      { w: '50%', bg: '#fb8c00', txt: 'Fair' },
      { w: '75%', bg: '#fdd835', txt: 'Good' },
      { w: '100%', bg: '#43a047', txt: 'Strong' },
    ];
    bar.style.width = levels[score].w;
    bar.style.background = levels[score].bg;
    lbl.textContent = levels[score].txt;
  }

  function validateForm() {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^[6-9]\d{9}$/;

    const n  = setField('name',    'nameErr',    document.getElementById('name').value.trim().length >= 3,    'Name must be at least 3 characters.');
    const e  = setField('email',   'emailErr',   emailRegex.test(document.getElementById('email').value.trim()), 'Enter a valid email address.');
    const ph = setField('phone',   'phoneErr',   phoneRegex.test(document.getElementById('phone').value.trim()), 'Enter a valid 10-digit Indian phone number.');
    const pw = setField('password','passErr',    document.getElementById('password').value.length >= 8,       'Password must be at least 8 characters.');
    const cm = setField('confirm', 'confirmErr', document.getElementById('confirm').value === document.getElementById('password').value && document.getElementById('confirm').value !== '', 'Passwords do not match.');
    const tk = document.getElementById('terms').checked;
    document.getElementById('termsErr').textContent = tk ? '' : 'You must accept the terms.';

    if (n && e && ph && pw && cm && tk) {
      document.getElementById('successBanner').style.display = 'block';
    }
  }
</script>
</body>
</html>
